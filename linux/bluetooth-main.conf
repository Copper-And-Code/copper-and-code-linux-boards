# Installed by copper-and-code-linux-boards (removed by mpy-uninstall): Bluetooth on at start, so that a paired
# controller connects again by itself when it is switched on.
[General]
FastConnectable = true
# A controller found by a search stays known for five minutes (30 seconds by default): enough to
# choose it in the Settings app and pair it.
TemporaryTimeout = 300

[Policy]
AutoEnable = true
