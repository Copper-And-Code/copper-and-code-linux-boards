# Options of the libretro cores, read by mpy-retro (key = "value", as in RetroArch).
# FBNeo: the sound's interpolation costs what the heaviest Neo Geo games (the fighting games of the
# late 1990s) need to keep their speed on a Cortex-A7.
fbneo-sample-interpolation = "disabled"
fbneo-fm-interpolation = "disabled"
fbneo-samplerate = "44100"
