site_name: lvgl-mpy-linux
site_description: Turn a Linux board into a MicroPython board with a touch screen
site_url: https://copper-and-code.github.io/lvgl-mpy-linux/
# Keep the repository link in content: Material's repository widget calls the GitHub API.
repo_url: ""
docs_dir: docs
site_dir: build/site
exclude_docs: |
  log/*.md

theme:
  name: material
  font: false
  logo: images/logo.svg
  favicon: images/logo.svg
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/site.css

nav:
  - Home: index.md
  - Getting started: stm32mp135f-dk-install.md
  - Examples: examples.md
  - The STM32MP135F-DK: stm32mp135f-dk.md
  - The display_driver contract: display-driver.md
  - The STM32MP157C-DK2 and its Cortex-M4: stm32mp157c-dk2.md
  - "machine on Linux's drivers": machine-linux.md
  - "Games: mpy-retro": retro.md
  - Phase 0 reconnaissance: ricognizione.md
  - Source on GitHub: https://github.com/Copper-And-Code/lvgl-mpy-linux
  - Copper and Code Studio: https://copper-and-code.github.io/copper-and-code-studio/
